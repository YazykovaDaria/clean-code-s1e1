<!DOCTYPE html>
<html lang="en">

<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="body">

  <header class="banner">
    <img src="./eisenhower-matrix.jpg" class="banner__img" alt="banner with matrix">
    <a class="banner__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>

  <main class="todo-list">
    <section>
      <h1 class="hidden">Add todo</h1>
      <div id="add-list">
        <label for="new-task" class="task__label">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task input" type="text">
          <button class="button">Add</button>
        </div>
      </div>
    </section>


    <section>
      <h2 class="title">Todo</h2>

      <ul id="incomplete">
        <li class="list__item">
          <input type="checkbox">
          <label class="task label">Pay Bills</label>
          <input type="text" class="task input">
          <button class="edit button">Edit</button>
          <button class="delete button" aria-label="remove">
            <img src="./remove.svg" class="button__img" alt="remove icon">
          </button>
        </li>

        <li class="edit list__item">
          <input type="checkbox">
          <label class="task label">Go Shopping</label>
          <input type="text" value="go shopping" class="task input">
          <button class="edit button">Save</button>
          <button class="delete button" aria-label="remove">
            <img src="./remove.svg" class="button__img" alt="remove icon">
          </button>
        </li>
      </ul>
    </section>

    <section>
      <h2 class="title">Completed</h2>

      <ul id="completed">
        <li class="list__item">
          <input type="checkbox" checked class="task__complete">
          <label class="task label">See the Doctor</label>
          <input type="text" class="task input">
          <button class="edit button">Edit</button>
          <button class="delete button" aria-label="remove">
            <img src="./remove.svg" class="button__img" alt="remove icon">
          </button>
        </li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
